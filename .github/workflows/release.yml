name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Verify source
        run: npm run check

      - name: Build portable executable
        run: npm run dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: OmniShell ${{ github.ref_name }}
          body_path: docs/${{ github.ref_name }}.md
          files: dist/OmniShell.exe
